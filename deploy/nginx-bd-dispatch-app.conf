# Template. deploy/install.sh fills in @API_PORT@ and writes the result to
# /etc/nginx/snippets/bd-dispatch-app.conf.
#
# Everything about proxying to the app, shared by the plain-http site
# (nginx-bd-dispatch.conf) and the https one (nginx-bd-dispatch-ssl.conf), so
# the two cannot drift apart.

# A sheet upload is capped at 15 MB by the app (MAX_UPLOAD_BYTES in main.py).
# nginx must allow at least that, or it rejects the file first and the app
# never gets to say anything useful about it.
client_max_body_size 20m;

# Building a cycle against a few thousand rows takes a while, and the browser
# is waiting on it. 60s, nginx's default, is not enough.
proxy_read_timeout  300s;
proxy_send_timeout  300s;

# The workbook exports are streamed. Buffering them would hold the whole file
# in nginx before a single byte reached the browser.
proxy_buffering off;

# No websockets anywhere in this app, so there is no Upgrade handling here.
# Sending Connection: upgrade on every request would only get in the way of
# keep-alive.
location / {
    proxy_pass http://127.0.0.1:@API_PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# The app does not limit sign-in attempts itself. Reachable from the internet,
# that is an open door to guessing passwords, so nginx does it: a burst of 5,
# then one attempt every 6 seconds per address. The zone is declared at the
# top of the site file, since limit_req_zone is only allowed there.
location = /api/auth/login {
    limit_req zone=bd_dispatch_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:@API_PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# Vite fingerprints every file under /assets, so the name changes whenever the
# contents do and these can be cached hard. index.html deliberately is not
# cached -- it is what points at the current fingerprints.
location /assets/ {
    proxy_pass http://127.0.0.1:@API_PORT@;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

access_log /var/log/nginx/bd-dispatch.access.log;
error_log  /var/log/nginx/bd-dispatch.error.log;
