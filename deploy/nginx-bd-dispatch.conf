# Template. deploy/install.sh fills in @HTTP_PORT@ and writes the result to
# /etc/nginx/sites-available/bd-dispatch.
#
# Plain http, for when no DOMAIN is set in backend/.env. With one set and a
# certificate issued, nginx-bd-dispatch-ssl.conf is used instead.
#
# nginx is here so the link you hand out is http://the-server and not
# http://the-server:8000, and so the app itself only ever listens on localhost.
# What it does with each request is in nginx-bd-dispatch-app.conf.

limit_req_zone $binary_remote_addr zone=bd_dispatch_login:1m rate=10r/m;

server {
    listen      @HTTP_PORT@ default_server;
    listen      [::]:@HTTP_PORT@ default_server;
    server_name _;

    # Where certbot drops its proof of domain ownership while
    # deploy/enable-https.sh asks for the first certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include snippets/bd-dispatch-app.conf;
}
