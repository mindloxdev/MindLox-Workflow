# Template. deploy/install.sh fills in @DOMAIN@ and writes the result to
# /etc/nginx/sites-available/bd-dispatch, once DOMAIN is set in backend/.env
# and deploy/enable-https.sh has a certificate for it.
#
# Port 80 does two things only: answers certbot's renewal checks, and sends
# everyone else to https. What nginx does with each request is in
# nginx-bd-dispatch-app.conf, shared with the plain-http site.

limit_req_zone $binary_remote_addr zone=bd_dispatch_login:1m rate=10r/m;

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # certbot renews over http. This must stay reachable, and must not
    # redirect, or renewal fails 90 days from now with nobody watching.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Every address -- the LAN IP, server.local, the domain -- lands on the one
    # name the certificate is for, so nobody sees a certificate warning.
    location / {
        return 301 https://@DOMAIN@$request_uri;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;

    # Mozilla's "intermediate" profile: every browser from the last several
    # years, nothing that is known to be weak.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:bd_dispatch_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers remember to use https for this name for six months. No
    # includeSubDomains: other names under the domain are not ours to decide.
    add_header Strict-Transport-Security "max-age=15552000" always;

    include snippets/bd-dispatch-app.conf;
}
